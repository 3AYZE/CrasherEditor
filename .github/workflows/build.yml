name: Build Crasher Editor

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Crasher Editor V1.3
        shell: cmd
        run: call BUILD_CRASHER_EDITOR_V1_3.cmd

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash "Crasher Editor V1.3.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Crasher Editor V1.3.exe" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crasher-Editor-V1.3
          path: |
            Crasher Editor V1.3.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish V1.3 release from CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.3"
          $title = "Crasher Editor V1.3"
          if (gh release view $tag 2>$null) {
            gh release edit $tag --title $title --target "${{ github.sha }}"
            gh release upload $tag "Crasher Editor V1.3.exe" SHA256SUMS.txt --clobber
          } else {
            gh release create $tag "Crasher Editor V1.3.exe" SHA256SUMS.txt --title $title --target "${{ github.sha }}" --notes "Offline Castle Crashers save editor. Built directly from the public source by GitHub Actions."
          }
