name: Build Crasher Editor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Crasher Editor V1.3
        shell: cmd
        run: call BUILD_CRASHER_EDITOR_V1_3.cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crasher-Editor-V1.3
          path: Crasher Editor V1.3.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag "Crasher Editor V1.3.exe" --clobber
          } else {
            gh release create $tag "Crasher Editor V1.3.exe" --title "Crasher Editor V1.3" --generate-notes
          }
